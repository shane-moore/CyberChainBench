[project]
name = "cyberchainbench"
version = "1.0.0"
description = "Benchmark for evaluating AI agents on Web3 smart contract bug detection, exploitation, and fixing"
license = { text = "MIT" }
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.42.0",
    "openai>=1.50.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "click>=8.0",
    "mcp[cli]>=1.0.0",
    "web3>=6.0.0b8",
    "eth-utils>=5.3.1",
    "eth-abi>=5.0.0",
    "py-solc-x>=1.1.1",
    "requests>=2.32.3",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "black>=25.0",
    "ruff>=0.11.0",
]
figures = [
    "matplotlib>=3.7",
    "numpy>=1.24",
]
proxy = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
full = [
    "cyberchainbench[dev,figures,proxy]",
]

[project.scripts]
web3bench = "eval.runner:cli"

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = """
(
  ^archive/
  | ^data/
  | ^tmp/
)
"""

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["archive", "data", "tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/entrypoints/**/*.py" = ["E402"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
